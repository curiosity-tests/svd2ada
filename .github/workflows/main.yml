run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  SVD2ADA_COMPILE_CHECKS: enabled
  SVD2ADA_RUNTIME_CHECKS: enabled
  SVD2ADA_STYLE_CHECKS: enabled
  SVD2ADA_CONTRACTS: enabled
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: alire-project/setup-alire@v3
        with:
          toolchain: gnat_native${{ matrix.gnat_version }} gprbuild${{ matrix.gprbuild_version }} --disable-assistant
      - run: alr build
